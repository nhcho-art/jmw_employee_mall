<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMW 임직원 MALL</title>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F5;
    --surface:#FFFFFF;
    --ink:#1C1A1B;
    --muted:#78706A;
    --border:#E7E1DA;
    --brand:#5B2247;
    --gold:#B8862E;
    --gold-bg:#FBF3E3;
    --maxw:1320px;
    --cmp-win-bg:#E3F5F1; --cmp-win-text:#0F7A6C;
    --cmp-diff-bg:#FBEEE0; --cmp-diff-text:#B5651D;
  }
  html{ scrollbar-gutter:stable; overflow-y:scroll; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none; -moz-user-select:none; user-select:none;
  }
  input, textarea{ -webkit-user-select:text; -moz-user-select:text; user-select:text; }
  img{ -webkit-user-drag:none; user-drag:none; pointer-events:none; }
  h1,h2,h3,.num{font-family:'Space Grotesk','Pretendard',sans-serif;}
  button{ font-family:inherit; }

  .notice-strip{
    font-size:12.5px; color:var(--muted); background:var(--gold-bg);
    padding:6px 20px; text-align:center; border-bottom:1px solid var(--border);
  }

  /* ---- Header ---- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:var(--surface);
  }
  .top-inner{
    max-width:var(--maxw); margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 14px;
    gap:24px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    cursor:pointer; user-select:none; flex:none;
  }
  .brand img{ height:40px; display:block; }
  .brand .mall-name{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px; font-weight:700; letter-spacing:-0.005em; color:var(--brand);
    padding-left:12px; border-left:1px solid var(--border);
  }

  .search-wrap{
    flex:1; max-width:420px; margin-left:auto;
    position:relative;
  }
  .search-wrap input{
    width:100%; height:38px; border:1px solid var(--border); border-radius:19px;
    padding:0 40px 0 16px; font-size:13.5px; background:var(--bg); color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{ border-color:var(--brand); background:var(--surface); }
  .search-wrap .icon{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    font-size:14px; color:var(--muted); cursor:pointer; background:none; border:none;
  }

  /* ---- Category nav ---- */
  nav.cats{
    max-width:var(--maxw); margin:0 auto;
    display:flex; align-items:center; gap:34px;
    padding:6px 16px 16px;
    overflow-x:auto;
  }
  nav.cats button{
    flex:none; background:none; border:none;
    color:var(--ink); padding:4px 0; cursor:pointer;
    font-family:'Space Grotesk','Pretendard',sans-serif;
    font-size:15px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
    position:relative;
  }
  nav.cats button.active{ color:var(--brand); font-weight:700; }
  nav.cats button.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-6px; height:2px; background:var(--brand);
  }
  nav.cats .dash-link{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    font-family:'Space Grotesk','Pretendard',sans-serif;
    color:var(--brand); font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
  }
  nav.cats .dash-link.active{ color:var(--brand); }

  main{ max-width:var(--maxw); margin:0 auto; padding:8px 16px 140px; }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ---- Sections / grids ---- */
  section.cat-section{ margin-top:44px; }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px;
  }
  .section-head h2{
    font-size:19px; font-weight:600; margin:0;
    display:flex; align-items:baseline; gap:8px;
  }
  .section-head h2 .tag{
    font-size:12px; color:var(--muted); font-weight:400; font-family:'Pretendard',sans-serif;
  }
  .section-head button.more{ background:none; border:none; font-size:12.5px; color:var(--muted); cursor:pointer; }

  .back-row{ margin-bottom:18px; }
  .back-row button{
    background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:0;
  }
  .view-title{ font-size:21px; font-weight:700; margin:6px 0 20px; }
  .view-sub{ font-size:13px; color:var(--muted); margin:-14px 0 20px; }

  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
  }
  @media (max-width:1000px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:700px){ .grid{ grid-template-columns:repeat(2,1fr); } }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    overflow:hidden; display:flex; flex-direction:column; cursor:pointer;
  }
  .thumb{
    aspect-ratio:1/1; position:relative;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:600; font-size:13px; text-align:center; padding:12px;
  }
  .badge-row{ position:absolute; top:8px; left:8px; display:flex; gap:4px; }
  .badge.fv{ background:var(--brand); color:#fff; }
  .badge{ font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:4px; background:rgba(255,255,255,.92); color:var(--ink); }

  .card-body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .model-code{ font-size:11px; color:var(--muted); }
  .name{ font-size:14px; font-weight:600; line-height:1.35; min-height:38px; }

  .price-row{ display:flex; align-items:baseline; gap:6px; margin-top:2px; }
  .price-row .list{ font-size:12px; color:var(--muted); text-decoration:line-through; }
  .price-row .emp-price{ font-size:17px; font-weight:700; color:var(--gold); }
  .price-row .won{ font-size:12px; color:var(--gold); font-weight:600; }

  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:8px; }
  .stepper{ display:flex; align-items:center; border:1px solid var(--border); border-radius:6px; }
  .stepper button{ width:26px; height:28px; border:none; background:none; cursor:pointer; font-size:14px; color:var(--ink); }
  .stepper span{ width:26px; text-align:center; font-size:13px; }
  .add-btn{ flex:1; background:var(--brand); color:#fff; border:none; border-radius:6px; height:32px; font-size:12.5px; font-weight:600; cursor:pointer; }

  /* ---- Cart drawer ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:70;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed; top:0; right:0; height:100%; width:360px; max-width:88vw;
    background:var(--surface); z-index:80;
    transform:translateX(100%); transition:transform .25s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .drawer-head h3{ margin:0; font-size:16px; }
  .drawer-head button{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); }
  .drawer-items{ flex:1; overflow-y:auto; padding:8px 20px; }
  .empty-cart{ color:var(--muted); font-size:13.5px; text-align:center; margin-top:60px; }

  .drawer-item{ display:flex; gap:10px; padding:14px 0; border-bottom:1px solid var(--border); }
  .drawer-item .thumb-sm{ width:52px; height:52px; border-radius:6px; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-size:9px; font-weight:700; }
  .drawer-item .info{ flex:1; min-width:0; }
  .drawer-item .info .n{ font-size:13px; font-weight:600; }
  .drawer-item .info .p{ font-size:12.5px; color:var(--gold); font-weight:700; margin-top:2px; }
  .drawer-item .row2{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .drawer-item .remove{ background:none; border:none; color:var(--muted); font-size:11.5px; cursor:pointer; text-decoration:underline; }
  .mini-stepper{ display:flex; align-items:center; border:1px solid var(--border); border-radius:6px; }
  .mini-stepper button{ width:22px; height:24px; border:none; background:none; cursor:pointer; font-size:13px; color:var(--ink); }
  .mini-stepper span{ width:22px; text-align:center; font-size:12px; }

  .drawer-foot{ padding:16px 20px 20px; border-top:1px solid var(--border); }
  .total-row{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:12px; }
  .total-row b{ font-size:18px; color:var(--gold); }
  .checkout-btn{ width:100%; background:var(--brand); color:#fff; border:none; border-radius:8px; height:46px; font-size:14.5px; font-weight:700; cursor:pointer; }

  /* ---- Compare bar ---- */
  .compare-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:55;
    background:var(--brand); color:#fff;
    padding:14px 20px; display:none;
    align-items:center; justify-content:center; gap:20px;
  }
  .compare-bar.show{ display:flex; }
  .compare-bar .cnt{ font-size:14px; font-weight:600; }
  .compare-bar button.go{
    background:#fff; color:var(--brand); border:none; border-radius:100px;
    padding:9px 22px; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .compare-bar button.clear{ background:none; border:none; color:rgba(255,255,255,.75); font-size:13px; cursor:pointer; text-decoration:underline; }

  /* ---- Compare modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{ background:var(--surface); border-radius:12px; max-width:760px; width:100%; max-height:80vh; overflow:auto; padding:24px; }
  .modal-box.compare-box{ max-width:calc(var(--maxw) + 80px); }
  .cmp-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cmp-head h3{ margin:0; font-size:17px; }
  .cmp-x{ background:none; border:none; font-size:18px; color:var(--muted); cursor:pointer; line-height:1; padding:4px; }
  .cmp-legend{ font-size:12px; color:var(--muted); margin-bottom:14px; line-height:1.5; }
  .cmp-legend .win-dot,.cmp-legend .diff-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 3px -1px 0; }
  .cmp-legend .win-dot{ background:var(--cmp-win-text); }
  .cmp-legend .diff-dot{ background:var(--cmp-diff-text); }

  table.cmp-table{ width:100%; table-layout:fixed; border-collapse:collapse; font-size:13px; }
  table.cmp-table th, table.cmp-table td{
    border-bottom:1px solid var(--border); padding:10px 12px; text-align:left; border-left:1px solid var(--border);
    white-space:normal; word-break:break-word;
  }
  table.cmp-table th:first-child, table.cmp-table td:first-child{
    border-left:none; width:150px; white-space:nowrap; color:var(--muted); font-weight:600; font-size:12px;
  }
  table.cmp-table th{ color:var(--muted); font-weight:600; font-size:12px; vertical-align:top; }
  table.cmp-table td.spec-win{ background:var(--cmp-win-bg); color:var(--cmp-win-text); font-weight:700; }
  table.cmp-table td.spec-win::before{ content:'▲ '; }
  table.cmp-table td.spec-diff{ background:var(--cmp-diff-bg); color:var(--cmp-diff-text); font-weight:600; }

  /* 비교 개수와 무관하게 위아래 높이는 고정 — 배경(칼럼 폭)만 좌우로 늘어남 */
  .cmp-thumb-wrap{ width:100%; height:170px; background:var(--bg); border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; overflow:hidden; }
  .cmp-thumb{ width:120px; height:120px; max-width:80%; max-height:80%; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; flex:none; }
  .cmp-remove{ display:block; width:100%; margin-top:10px; background:none; border:1px solid var(--border); color:#B4402A; font-size:11px; padding:5px 0; border-radius:6px; cursor:pointer; }
  .cmp-remove:hover{ background:#FBEAEA; }
  .cmp-cart-btn{ width:100%; background:var(--brand); color:#fff; border:none; border-radius:6px; padding:8px 0; font-size:12px; font-weight:700; cursor:pointer; }
  .cmp-cart-btn:disabled{ background:var(--muted); cursor:default; }

  .cmp-insights{ margin-top:28px; }
  .cmp-insights h4{ font-size:14px; margin:0 0 4px; }
  .cmp-insights .sub{ font-size:12px; color:var(--muted); margin-bottom:14px; }
  .insight-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:14px; }
  .insight-card{ background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .insight-card b{ display:block; font-size:12.5px; margin-bottom:8px; }
  .insight-card ul{ margin:0; padding-left:16px; font-size:12px; color:var(--ink); line-height:1.6; }

  /* ---- 단일 상품 상세 뷰 ---- */
  .single-view{ display:flex; gap:28px; }
  .single-photo{ width:320px; flex:none; height:320px; background:var(--bg); border-radius:12px; display:flex; align-items:center; justify-content:center; }
  .single-photo .cmp-thumb{ width:200px; height:200px; }
  .single-info{ flex:1; min-width:0; }
  .single-crumb{ font-size:12px; color:var(--muted); margin-bottom:6px; }
  .single-title{ font-size:21px; font-weight:700; margin-bottom:6px; }
  .single-sub{ font-size:13px; color:var(--muted); margin-bottom:12px; }
  .single-badges{ display:flex; gap:6px; margin-bottom:18px; }
  .single-badges span{ font-size:11.5px; padding:4px 10px; border-radius:100px; background:var(--gold-bg); color:var(--brand); font-weight:600; }
  .single-price{ font-size:22px; font-weight:700; color:var(--gold); margin-bottom:18px; }
  table.single-spec{ width:100%; border-collapse:collapse; font-size:13px; margin-bottom:20px; }
  table.single-spec td{ padding:9px 0; border-bottom:1px solid var(--border); }
  table.single-spec td:first-child{ width:110px; color:var(--muted); font-weight:600; font-size:12px; }
  .single-add-btn{ background:var(--brand); color:#fff; border:none; border-radius:8px; padding:12px 22px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .single-add-btn:disabled{ background:var(--muted); cursor:default; }
  .single-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .single-link-btn{
    background:#fff; color:var(--brand); border:1.5px solid var(--brand); border-radius:8px;
    padding:12px 22px; font-size:13.5px; font-weight:700; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center;
  }
  .single-link-btn:hover{ background:var(--gold-bg); }
  @media (max-width:700px){ .single-view{ flex-direction:column; } .single-photo{ width:100%; } }

  .cmp-box{
    position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:5px;
    background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:12px; color:transparent; font-weight:700;
  }
  .cmp-box.checked{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .modal-close{ margin-top:16px; background:var(--ink); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13px; cursor:pointer; }

  /* ---- Floating action stack (cart + chat) ---- */
  .fab-stack{
    position:fixed; right:22px; bottom:24px; z-index:60;
    display:flex; flex-direction:column; gap:12px; align-items:flex-end;
    transition:bottom .2s;
  }
  .fab-stack.raised{ bottom:78px; }
  .fab{
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 4px 14px rgba(0,0,0,.18); position:relative;
  }
  .fab.cart{ background:var(--brand); color:#fff; }
  .fab.chat{ background:#1DB954; background:var(--gold); color:#fff; }
  .fab .count{
    position:absolute; top:-4px; right:-4px; background:var(--gold);
    color:#fff; min-width:18px; height:18px; border-radius:9px; font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  /* ---- Dashboard ---- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
  @media (max-width:860px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } }
  .kpi-card{
    border-radius:14px; padding:20px 22px; color:#fff; position:relative; overflow:hidden;
  }
  .kpi-card::after{
    content:''; position:absolute; right:-14px; bottom:-14px; width:84px; height:84px;
    border-radius:50%; background:rgba(255,255,255,.08);
  }
  .kpi-card .label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
    color:rgba(255,255,255,.75); margin-bottom:10px; position:relative; z-index:1;
  }
  .kpi-card .value{
    font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700;
    letter-spacing:-0.5px; position:relative; z-index:1;
  }
  .kc1{ background:linear-gradient(135deg,#4A1A38 0%,#5B2247 60%,#7A3563 100%); }
  .kc2{ background:linear-gradient(135deg,#9A6D1F 0%,#B8862E 60%,#D9A94A 100%); }
  .kc3{ background:linear-gradient(135deg,#181617 0%,#3D3436 100%); }
  .kc4{ background:linear-gradient(135deg,#33473C 0%,#4B6B57 100%); }

  .dash-filter{ display:flex; align-items:center; gap:8px; margin-bottom:22px; }
  .dash-filter .ftab{
    padding:7px 18px; border-radius:16px; border:1.5px solid var(--border); background:#fff;
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .dash-filter .ftab.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .dash-filter select{
    padding:7px 12px; border-radius:16px; border:1.5px solid var(--border); background:#fff;
    font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; outline:none;
  }

  .dash-charts-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
  @media (max-width:900px){ .dash-charts-row{ grid-template-columns:1fr; } }
  .chart-box{ position:relative; height:230px; }

  .donut-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
  @media (max-width:900px){ .donut-row{ grid-template-columns:1fr; } }
  .donut-wrap{ display:flex; align-items:center; gap:24px; }
  .donut-wrap .chart-box{ height:140px; width:140px; flex:none; }
  .donut-legend{ font-size:12.5px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .donut-legend .li{ display:flex; align-items:center; gap:8px; }
  .donut-legend .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .donut-legend .val{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-weight:600; }
  .dash-row{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:24px; }
  @media (max-width:900px){ .dash-row{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .panel-hd{
    padding:13px 20px; background:var(--gold-bg); border-bottom:1px solid var(--border);
    font-size:13.5px; font-weight:700; color:var(--brand);
  }
  .panel-body{ padding:20px; }
  .bar-item{ margin-bottom:12px; }
  .bar-item .bl{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
  .bar-item .bl span:last-child{ font-family:'JetBrains Mono',monospace; }
  .bar-track{ height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--brand); border-radius:4px; }
  .bar-fill.gold{ background:var(--gold); }

  table.dept-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.dept-table th, table.dept-table td{ padding:9px 6px; border-bottom:1px solid var(--border); text-align:left; }
  table.dept-table th{ color:var(--muted); font-weight:600; font-size:12px; }

  .site-footer{
    border-top:1px solid var(--border); margin-top:20px;
    padding:22px 16px 28px; text-align:center;
  }
  .site-footer .inner{
    max-width:var(--maxw); margin:0 auto;
    display:flex; align-items:center; justify-content:center; gap:14px;
    flex-wrap:wrap; font-size:11.5px; color:var(--muted);
  }
  .site-footer .ver{
    font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--brand);

  .added-actions .submit-order-btn{ background:var(--brand); color:#fff; }

  .field-row input{ width:100%; height:38px; border:1px solid var(--border); border-radius:8px; padding:0 12px; font-size:13.5px; outline:none; background:#fff; color:var(--ink); }
  .field-row input:focus{ border-color:var(--brand); }
  .field-row input:disabled{ background:var(--bg); color:var(--muted); }

  .field-row .req{ color:#B4402A; font-weight:600; }

  .chk-row{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); cursor:pointer; }

  .pay-btn, .paid-btn{

  .notice-box{

  .mock-note{ text-align:center; color:var(--muted); font-size:11.5px; margin-top:50px; padding-top:16px; border-top:1px dashed var(--border); }

        </div>
        <input id="ofAddrBase" type="text" placeholder="기본주소 (검색 버튼으로 채워집니다)" readonly style="margin-top:8px;">

      </div>
      <div class="field-row">
        <label>결제수단</label>
        <div class="pay-toggle" id="payMethodToggle">
          <button type="button" class="pay-btn active" data-pay="계좌이체" onclick="setPayMethod('계좌이체')">계좌이체</button>
          <button type="button" class="pay-btn" data-pay="카드결제" onclick="setPayMethod('카드결제')">카드결제</button>

      </div>

            <div class="pay-toggle small">
              <button type="button" class="paid-btn" data-paid="Y" onclick="setPaidStatus('Y')">입금완료</button>
              <button type="button" class="paid-btn" data-paid="N" onclick="setPaidStatus('N')">미입금</button>
            </div>
          </div>
        </div>
        <label class="chk-row" style="margin-top:14px;">
          <input type="checkbox" id="ofCashReceipt" onchange="toggleCashReceipt()"> 현금영수증 발행
        </label>
        <div class="field-row" id="cashReceiptRow" style="display:none; margin-top:8px;">
          <input id="ofCashReceiptNo" type="text" placeholder="발행번호 (휴대폰번호 또는 사업자번호)">

/* ---------- 네비게이션 ---------- */
function renderNav(activeKey){
  const nav = document.getElementById('catNav');
  nav.innerHTML = CATEGORIES.map(c=>
    `<button data-cat="${c.key}" class="${c.key===activeKey?'active':''}" onclick="showCategoryView('${c.key}')">${c.label}</button>`
  ).join('') + `<button class="dash-link ${activeKey==='dashboard'?'active':''}" onclick="showView('dashboard')">DASHBOARD</button>`;
}

function setActiveView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

function showView(name){
  if(name==='home'){ renderHome(); renderNav(null); setActiveView('view-home'); }
  if(name==='dashboard'){ renderDashboard(); renderNav('dashboard'); setActiveView('view-dashboard'); }
}

/* ---------- 카드 렌더 ---------- */
function releaseSortKey(p){
  if(!p.released) return 0;
  const m = p.released.match(/(\d{4})\.(\d{1,2})/);
  return m ? parseInt(m[1])*100 + parseInt(m[2]) : 0;
}
function sortByLatest(list){ return [...list].sort((a,b)=> releaseSortKey(b) - releaseSortKey(a)); }

function isFreeVoltage(p){
  if(!p.specs) return false;
  const text = Object.values(p.specs).join(' ');
  if(/프리볼트|free\s*volt/i.test(text)) return true;
  const m = text.match(/(\d{2,3})\s*[-~]\s*(\d{2,3})\s*V/i);
  if(m){
    const lo = parseInt(m[1]), hi = parseInt(m[2]);
    if(lo<=130 && hi>=220) return true;
  }
  return false;
}

function productCard(p){
  const idx = PRODUCTS.indexOf(p);
  const qty = cart[p.id]?.qty || 0;
  const checked = compareSet.has(p.id);
  const noPrice = p.emp===null || p.emp===undefined;
  const img = PRODUCT_IMAGES[p.model];
  return `
  <div class="card" onclick="viewSingleProduct('${p.id}')">
    <div class="thumb" style="background:${img?'#fff':colorFor(idx)}">
      <div class="badge-row">${p.best?'<span class="badge">BEST</span>':''}${isFreeVoltage(p)?'<span class="badge fv">프리볼트</span>':''}</div>
      <div class="cmp-box ${checked?'checked':''}" data-id="${p.id}" onclick="event.stopPropagation(); toggleCompare('${p.id}', this)">✓</div>
      ${img?`<img src="${img}" style="width:100%;height:100%;object-fit:contain;">`:p.model}
    </div>
    <div class="card-body">
      <div class="model-code">품번 ${p.model}${p.released?` · 출시 ${p.released}`:''}</div>
      <div class="name">${p.name}</div>
      <div class="price-row">
        ${noPrice ? `<span style="color:var(--muted);font-size:13px;">가격 확인중</span>` : `<span class="emp-price">${p.emp.toLocaleString('ko-KR')}</span><span class="won">원</span>`}
      </div>
      <div class="qty-row">
        <div class="stepper">
          <button onclick="event.stopPropagation(); stepQty('${p.id}',-1)" ${noPrice?'disabled':''}>–</button>
          <span id="qty-${p.id}">${qty}</span>
          <button onclick="event.stopPropagation(); stepQty('${p.id}',1)" ${noPrice?'disabled':''}>+</button>
        </div>
        <button class="add-btn" onclick="event.stopPropagation(); addToCart('${p.id}')" ${noPrice?'disabled style="opacity:.5;cursor:not-allowed;"':''}>담기</button>
      </div>
    </div>
  </div>`;
}

/* ---------- 검색 ---------- */
function productMatchesQuery(p, q){
  if(p.name.toLowerCase().includes(q) || p.model.toLowerCase().includes(q)) return true;
  if(q==='프리볼트' || q==='free voltage' || q==='freevolt'){ if(isFreeVoltage(p)) return true; }
  if(p.specs){
    for(const v of Object.values(p.specs)){
      if(v && String(v).toLowerCase().includes(q)) return true;
    }
  }
  return false;
}
function doSearch(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const el = document.getElementById('view-search');
  if(!q){
    el.innerHTML = `<div class="view-sub">검색어를 입력해주세요.</div>`;
  } else {
    const items = sortByLatest(PRODUCTS.filter(p=> productMatchesQuery(p, q)));
    el.innerHTML = `
      <div class="back-row"><button onclick="showView('home')">← 홈으로</button></div>
      <div class="view-title">'${q}' 검색결과</div>
      <div class="view-sub">${items.length}개 모델</div>
      ${items.length? `<div class="grid">${items.map(productCard).join('')}</div>` : `<div class="view-sub">일치하는 모델이 없습니다.</div>`}`;
  }
  renderNav(null);
  setActiveView('view-search');
}

/* ---------- 수량/장바구니 ---------- */
function stepQty(id, delta){
  const el = document.getElementById('qty-'+id);
  let v = parseInt(el.textContent,10) + delta;
  if(v<0) v=0;
  el.textContent = v;
  pendingQty[id]=v;
}
function addToCart(id){
  const p = PRODUCTS.find(p=>p.id===id);
  if(p.emp===null || p.emp===undefined){ alert('아직 가격이 확정되지 않은 상품입니다.'); return; }
  const qty = pendingQty[id] ?? (cart[id]?.qty||0);
  const finalQty = qty>0 ? qty : 1;
  cart[id] = { ...p, qty: finalQty };
  const qtyEl = document.getElementById('qty-'+id);
  if(qtyEl) qtyEl.textContent = finalQty;
  saveCart(cart);
  renderCartUI();
  document.getElementById('addedModalOverlay').classList.add('show');
}
function closeAddedModal(){ document.getElementById('addedModalOverlay').classList.remove('show'); }
function goToOrderFromAdded(){ closeAddedModal(); openOrderModal(); }

function removeFromCart(id){
  delete cart[id];
  saveCart(cart);
  const qtyEl = document.getElementById('qty-'+id);
  if(qtyEl) qtyEl.textContent = 0;
  renderCartUI();
}
function changeCartQty(id, delta){
  if(!cart[id]) return;
  cart[id].qty += delta;
  if(cart[id].qty<=0) delete cart[id];
  saveCart(cart);
  const qtyEl = document.getElementById('qty-'+id);
  if(qtyEl) qtyEl.textContent = cart[id]?cart[id].qty:0;
}
function drawerQtyChange(id, delta){ changeCartQty(id, delta); renderCartUI(); }
function cartCount(){ return Object.values(cart).reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return Object.values(cart).reduce((s,i)=>s+i.qty*i.emp,0); }

function renderCartUI(){
  document.getElementById('cartCount').textContent = cartCount();
  const wrap = document.getElementById('drawerItems');
  const items = Object.values(cart);
  if(items.length===0){
    wrap.innerHTML = `<div class="empty-cart">장바구니가 비어있습니다</div>`;
  } else {
    wrap.innerHTML = items.map(i=>{
      const idx = PRODUCTS.findIndex(p=>p.id===i.id);
      return `
      <div class="drawer-item">
        <div class="thumb-sm" style="background:${PRODUCT_IMAGES[i.model]?'#fff':colorFor(idx)}">${PRODUCT_IMAGES[i.model]?`<img src="${PRODUCT_IMAGES[i.model]}" style="width:100%;height:100%;object-fit:contain;">`:i.model}</div>
        <div class="info">
          <div class="n">${i.name}</div>
          <div class="p">${fmt(i.emp)} × ${i.qty}</div>
          <div class="row2">
            <div class="mini-stepper">
              <button onclick="drawerQtyChange('${i.id}',-1)">–</button>
              <span>${i.qty}</span>
              <button onclick="drawerQtyChange('${i.id}',1)">+</button>
            </div>
            <button onclick="removeFromCart('${i.id}')" class="remove">삭제</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('drawerTotal').textContent = fmt(cartTotal());
}
function openCart(){ document.getElementById('drawer').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeCart(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

/* ---------- 비교 ---------- */
function toggleCompare(id, el){
  if(compareSet.has(id)){
    compareSet.delete(id); el.classList.remove('checked');
  } else {
    if(compareSet.size>=4){ alert('제품 비교는 최대 4개까지 선택할 수 있습니다.'); return; }
    compareSet.add(id); el.classList.add('checked');
  }
  renderCompareBar();
}
function renderCompareBar(){
  const bar = document.getElementById('compareBar');
  const fab = document.getElementById('fabStack');
  if(compareSet.size>0){
    bar.classList.add('show');
    fab.classList.add('raised');
    document.getElementById('compareCnt').textContent = compareSet.size+'개 선택됨';
  } else {
    bar.classList.remove('show');
    fab.classList.remove('raised');
  }
}
function clearCompare(){
  compareSet.clear();
  document.querySelectorAll('.cmp-box.checked').forEach(el=>el.classList.remove('checked'));
  renderCompareBar();
  closeCompareModal();
}

// 무게처럼 작을수록 좋은 항목. 그 외 숫자 항목은 클수록 좋은 것으로 간주.
const LOWER_IS_BETTER = new Set(['무게','소음']);
function parseSpecNumber(key, str){
  if(!str) return null;
  const s = String(str);
  const m = s.match(/[\d.]+/);
  if(!m) return null;
  let v = parseFloat(m[0]);
  if(key==='무게' && /kg/i.test(s)) v *= 1000; // kg -> g 통일
  return isNaN(v) ? null : v;
}

const SPEC_PHRASE = {
  '무게': v=>`가장 가벼워 손목에 부담이 적습니다 (${v})`,
  '코드길이': v=>`코드가 가장 길어 콘센트에서 멀리 떨어져도 여유롭게 사용할 수 있습니다 (${v})`,
  '와트': v=>`출력이 가장 높습니다 (${v})`,
  '풍속': v=>`바람 세기가 가장 강합니다 (${v})`,
};
function insightBullets(p, items){
  const bullets = [];
  if(isFreeVoltage(p)) bullets.push('프리볼트(100~240V) 지원으로 해외에서도 전압 걱정 없이 사용할 수 있습니다.');
  if(p.specs && p.specs['기능']){
    p.specs['기능'].split('/').map(s=>s.trim()).filter(Boolean).forEach(f=>bullets.push(f+'를 지원합니다.'));
  }
  if(items.length>1 && p.specs){
    Object.keys(p.specs).forEach(k=>{
      if(k==='기능') return;
      const nums = items.map(x=> x.specs ? parseSpecNumber(k, x.specs[k]) : null);
      if(nums.every(n=>n!==null) && new Set(nums).size>1){
        const best = LOWER_IS_BETTER.has(k) ? Math.min(...nums) : Math.max(...nums);
        const myVal = parseSpecNumber(k, p.specs[k]);
        if(myVal===best){
          const phrase = SPEC_PHRASE[k] ? SPEC_PHRASE[k](p.specs[k]) : `${k} 항목에서 가장 우수합니다 (${p.specs[k]})`;
          bullets.push(phrase);
        }
      }
    });
  }
  if(bullets.length===0) bullets.push('등록된 사양 특징 정보가 없습니다.');
  return bullets;
}

function viewSingleProduct(id){ openCompareModal([id]); }

function removeFromCompareOrClose(id){
  if(compareSet.has(id)){
    compareSet.delete(id);
    document.querySelectorAll(`.cmp-box[data-id="${id}"]`).forEach(el=>el.classList.remove('checked'));
    renderCompareBar();
    if(compareSet.size>0){ openCompareModal(); return; }
  }
  closeCompareModal();
}

function addToCompareFromSingle(id, btnEl){
  if(!compareSet.has(id)){
    if(compareSet.size>=4){ alert('제품 비교는 최대 4개까지 선택할 수 있습니다.'); return; }
    compareSet.add(id);
    document.querySelectorAll(`.cmp-box[data-id="${id}"]`).forEach(el=>el.classList.add('checked'));
    renderCompareBar();
  }
  if(btnEl){ btnEl.textContent = '✓ 비교함에 담김'; btnEl.disabled = true; }
}

function openCompareModal(idsOverride){
  const ids = idsOverride || [...compareSet];
  const items = PRODUCTS.filter(p=>ids.includes(p.id));
  if(items.length===0){ closeCompareModal(); return; }

  const content = document.getElementById('compareContent');
  const titleEl = document.getElementById('compareTitle');

  if(items.length===1){
    /* ---------- 단일 상품 정보 뷰 ---------- */
    const p = items[0];
    const idx = PRODUCTS.indexOf(p);
    titleEl.textContent = '제품 정보';
    const catLabel = (CATEGORIES.find(c=>c.key===p.cat)||{}).label || p.cat;
    const specRows = p.specs ? Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('') : '';
    const inCompare = compareSet.has(p.id);
    const noPrice = p.emp===null || p.emp===undefined;
    content.innerHTML = `
      <div class="single-view">
        <div class="single-photo">${PRODUCT_IMAGES[p.model] ? `<img src="${PRODUCT_IMAGES[p.model]}" style="width:100%;height:100%;object-fit:contain;">` : `<div class="cmp-thumb" style="background:${colorFor(idx)}">${p.model}</div>`}</div>
        <div class="single-info">
          <div class="single-crumb">${catLabel}</div>
          <div class="single-title">${p.name}</div>
          <div class="single-sub">품번 ${p.model}</div>
          <div class="single-badges">${p.released?`<span>출시 ${p.released}</span>`:''}${isFreeVoltage(p)?'<span>프리볼트</span>':''}</div>
          <div class="single-price">${p.emp!=null ? fmt(p.emp) : '가격 확인중'}</div>
          ${specRows ? `<table class="single-spec">${specRows}</table>` : `<div style="color:var(--muted);font-size:13px;margin-bottom:18px;">등록된 사양 정보가 없습니다.</div>`}
          <div class="single-actions">
            <button class="single-add-btn" ${noPrice?'disabled':''} onclick="addToCart('${p.id}')">🛒 장바구니 담기</button>
            <button class="single-link-btn" style="border-color:var(--border);color:var(--ink);${inCompare?'opacity:.5;':''}" ${inCompare?'disabled':''} onclick="addToCompareFromSingle('${p.id}', this)">${inCompare?'✓ 비교함에 담김':'+ 비교함에 담기'}</button>
            ${p.url?`<a href="${p.url}" target="_blank" rel="noopener" class="single-link-btn">${p.url.includes('jmwmall')?'자사몰':'PRO몰'}에서 보기 ↗</a>`:''}
          </div>
        </div>
      </div>`;
  } else {
    /* ---------- 다중 비교 뷰 ---------- */
    titleEl.textContent = '제품 비교';
    const effSpecs = new Map(items.map(p=>[p.id, p.specs ? {...p.specs, ...(isFreeVoltage(p)?{'프리볼트':'지원'}:{})} : null]));
    const specKeySet = new Set();
    items.forEach(p=>{ const s=effSpecs.get(p.id); if(s) Object.keys(s).forEach(k=>specKeySet.add(k)); });
    const specKeys = [...specKeySet];

    const headerCells = items.map(p=>{
      const idx = PRODUCTS.indexOf(p);
      return `<th>
        <div class="cmp-thumb-wrap">${PRODUCT_IMAGES[p.model] ? `<img src="${PRODUCT_IMAGES[p.model]}" style="width:100%;height:100%;object-fit:contain;">` : `<div class="cmp-thumb" style="background:${colorFor(idx)}">${p.model}</div>`}</div>
        ${p.name}<br><span style="font-weight:400;color:var(--muted);">품번 ${p.model}${p.released?' · '+p.released:''}</span>
        <button class="cmp-remove" onclick="removeFromCompareOrClose('${p.id}')">✕ 비교에서 제외</button>
      </th>`;
    }).join('');

    const priceRow = `<tr><td><b>직원가</b></td>${items.map(p=>`<td style="color:var(--gold);font-weight:700;">${p.emp!=null?fmt(p.emp):'가격 확인중'}</td>`).join('')}</tr>`;
    const cartRow = `<tr><td></td>${items.map(p=>{
      const noPrice = p.emp===null || p.emp===undefined;
      return `<td><button class="cmp-cart-btn" ${noPrice?'disabled':''} onclick="addToCart('${p.id}')">🛒 장바구니 담기</button></td>`;
    }).join('')}</tr>`;

    const specRows = specKeys.length ? specKeys.map(k=>{
      let winVal = null;
      const rawVals = items.map(p=> (effSpecs.get(p.id) && effSpecs.get(p.id)[k]) || null);
      const allDiffer = new Set(rawVals).size > 1;
      if(allDiffer){
        const nums = items.map(p=> effSpecs.get(p.id) ? parseSpecNumber(k, effSpecs.get(p.id)[k]) : null);
        if(nums.every(n=>n!==null) && new Set(nums).size>1){
          winVal = LOWER_IS_BETTER.has(k) ? Math.min(...nums) : Math.max(...nums);
        }
      }
      const cells = items.map(p=>{
        const s = effSpecs.get(p.id);
        const raw = (s && s[k]) || '-';
        let cls = '';
        if(winVal!==null){
          const n = parseSpecNumber(k, s && s[k]);
          cls = n===winVal ? ' class="spec-win"' : '';
        } else if(allDiffer && raw!=='-'){
          cls = ' class="spec-diff"';
        }
        return `<td${cls}>${raw}</td>`;
      }).join('');
      return `<tr><td>${k}</td>${cells}</tr>`;
    }).join('') : `<tr><td colspan="${items.length+1}" style="color:var(--muted);">등록된 사양 정보가 없습니다.</td></tr>`;

    const insights = `
      <div class="cmp-insights">
        <h4>인사이트 &amp; 추천</h4>
        <div class="sub">각 모델의 사양을 바탕으로 어떤 상황에 더 맞는지 정리했습니다.</div>
        <div class="insight-grid" style="grid-template-columns:repeat(${items.length},1fr)">
          ${items.map(p=>`<div class="insight-card"><b>${p.name}</b><ul>${insightBullets(p, items).map(b=>`<li>${b}</li>`).join('')}</ul></div>`).join('')}
        </div>
      </div>`;

    content.innerHTML = `
      <div class="cmp-legend"><span class="win-dot"></span>는 해당 항목에서 더 좋은 값(가벼움·긴 코드·높은 출력 등, 방향에 맞게 자동 판단)을 의미하며, <span class="diff-dot"></span>그 외 값이 다른 항목은 강조 표시됩니다.</div>
      <table class="cmp-table">
        <tr><th>구분</th>${headerCells}</tr>
        ${priceRow}
        ${cartRow}
        ${specRows}
      </table>
      ${insights}`;
  }

  document.getElementById('compareModalOverlay').classList.add('show');
  const box = document.querySelector('#compareModalOverlay .modal-box');
  if(box) box.scrollTop = 0;
}
function closeCompareModal(){ document.getElementById('compareModalOverlay').classList.remove('show'); }

/* ---------- 주문서 ---------- */
let payMethod = '계좌이체';
let paidStatus = null;

function execDaumPostcode(){
  if(typeof daum === 'undefined' || !daum.Postcode){
    alert('주소 검색 서비스를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.');
    return;
  }
  new daum.Postcode({
    oncomplete: function(data){
      const addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
      document.getElementById('ofZip').value = data.zonecode;
      document.getElementById('ofAddrBase').value = addr;
      document.getElementById('ofAddrDetail').focus();
    }
  }).open();
}

function openOrderModal(){
  if(Object.keys(cart).length===0){ alert('장바구니가 비어있습니다.'); return; }
  renderOrderSummary();
  document.getElementById('orderTotal').textContent = fmt(cartTotal());
  payMethod = '계좌이체';
  paidStatus = null;
  document.querySelectorAll('#payMethodToggle .pay-btn').forEach(b=>b.classList.toggle('active', b.dataset.pay==='계좌이체'));
  document.querySelectorAll('#bankFields .paid-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('bankFields').style.display = 'block';
  document.getElementById('cardNotice').style.display = 'none';
  document.getElementById('ofCashReceipt').checked = false;
  document.getElementById('cashReceiptRow').style.display = 'none';
  document.getElementById('ofCashReceiptNo').value = '';
  document.getElementById('ofDepositor').value = '';
  closeCart();
  closeAddedModal();
  const overlay = document.getElementById('orderModalOverlay');
  overlay.classList.add('show');
  const box = overlay.querySelector('.modal-box');
  if(box) box.scrollTop = 0;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}
function closeOrderModal(){ document.getElementById('orderModalOverlay').classList.remove('show'); }

function orderQtyChange(id, delta){
  changeCartQty(id, delta);
  if(Object.keys(cart).length===0){ closeOrderModal(); renderCartUI(); return; }
  renderOrderSummary();
  document.getElementById('orderTotal').textContent = fmt(cartTotal());
  renderCartUI();
}

function renderOrderSummary(){
  const items = Object.values(cart);
  document.getElementById('orderSummary').innerHTML = `
    <table class="order-items-table">
      <tr><th>품번 · 품명</th><th>수량</th><th>금액</th></tr>
      ${items.map(i=>`
        <tr>
          <td>${i.model} · ${i.name}</td>
          <td>
            <div class="mini-stepper">
              <button onclick="orderQtyChange('${i.id}',-1)">–</button>
              <span>${i.qty}</span>
              <button onclick="orderQtyChange('${i.id}',1)">+</button>
            </div>
          </td>
          <td>${fmt(i.emp*i.qty)}</td>
        </tr>`).join('')}
    </table>`;
}

function setPayMethod(m){
  payMethod = m;
  document.querySelectorAll('#payMethodToggle .pay-btn').forEach(b=>b.classList.toggle('active', b.dataset.pay===m));
  document.getElementById('bankFields').style.display = m==='계좌이체' ? 'block' : 'none';
  document.getElementById('cardNotice').style.display = m==='카드결제' ? 'block' : 'none';
}

function setPaidStatus(v){
  paidStatus = v;
  document.querySelectorAll('#bankFields .paid-btn').forEach(b=>b.classList.toggle('active', b.dataset.paid===v));
}

function toggleCashReceipt(){
  const on = document.getElementById('ofCashReceipt').checked;
  document.getElementById('cashReceiptRow').style.display = on ? 'block' : 'none';
}

function syncRecipient(){
  const same = document.getElementById('ofSameRecipient').checked;
  const rn = document.getElementById('ofRecvName'), rp = document.getElementById('ofRecvPhone');
  rn.disabled = same; rp.disabled = same;
  if(same){
    rn.value = document.getElementById('ofName').value;
    rp.value = document.getElementById('ofPhone').value;
  }
}

function submitOrder(){
  const dept = document.getElementById('ofDept').value.trim();
  const name = document.getElementById('ofName').value.trim();
  const phone = document.getElementById('ofPhone').value.trim();
  const recvName = document.getElementById('ofRecvName').value.trim();
  const recvPhone = document.getElementById('ofRecvPhone').value.trim();
  const addrBase = document.getElementById('ofAddrBase').value.trim();
  const addrDetail = document.getElementById('ofAddrDetail').value.trim();
  if(!dept||!name||!phone||!addrBase){ alert('필수 항목을 모두 입력해주세요. (주소는 검색 버튼으로 입력)'); return; }
  if(!recvName||!recvPhone){ alert('수령인 정보를 입력해주세요.'); return; }
  if(!addrDetail){ alert('상세주소를 입력해주세요.'); return; }

  if(payMethod==='계좌이체'){
    if(!document.getElementById('ofDepositor').value.trim()){ alert('계좌이체 선택 시 입금자명은 필수입니다.'); return; }
    if(!paidStatus){ alert('입금여부(입금완료 / 미입금)를 선택해주세요.'); return; }
    if(document.getElementById('ofCashReceipt').checked && !document.getElementById('ofCashReceiptNo').value.trim()){
      alert('현금영수증 발행번호를 입력해주세요.'); return;
    }
  }

  alert('주문이 접수되었습니다.\n\n(실제 연동 시 이 시점에 구글시트 기록 + 영업지원팀 구글챗 알림이 자동 발송됩니다)');
  cart = {}; saveCart(cart); renderCartUI();
  closeOrderModal();
}

/* ---------- 대시보드 더미 데이터 ---------- */
const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const SALES_THIS_YEAR = [28,32,35,38,41,45,48,44,52,58,61,65].map(v=>v*1000000);
const SALES_LAST_YEAR  = [22,25,27,30,33,35,37,36,40,44,47,50].map(v=>v*1000000);
const ORDER_COUNT_MONTH = [78,85,92,98,105,118,124,115,132,145,152,158];
const PARTICIPANTS_MONTH = [22,25,27,29,31,34,36,33,38,41,43,45];
const CHANNEL_AMOUNT = { 'JMW':312000000, '기화':145000000 };
const MFG_AMOUNT = { 'JMW':268000000, '소싱':189000000 };
const CATEGORY_AMOUNT = { '드라이어':192000000,'스타일러':98000000,'헤어케어':61000000,'생활가전':54000000,'악세사리':22000000 };
const TOP10_AMOUNT = [
  ['M50 베이직 드라이어',41000000],['에어플립 스타일러',35000000],['에어뮤즈 서큘레이터',28000000],
  ['루미에어 2.0',26000000],['블로우셋 에어스타일러',21000000],['볼륨온 플러스',18000000],
  ['바디드라이어 벨린',15000000],['MS60 스탠다드 드라이어',13000000],['케어부스터',11000000],['로아띠 컬크림',9000000],
];
let dashPeriod = 'annual';
let dashMonth = 8; // 9월 기본
let _trendChart=null, _yoyChart=null, _channelDonut=null, _mfgDonut=null;

function setDashPeriod(mode){
  dashPeriod = mode;
  const sel = document.getElementById('dashMonthSelect');
  if(sel) sel.style.display = mode==='monthly' ? 'inline-block' : 'none';
  document.querySelectorAll('.dash-filter .ftab').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
  renderDashboard();
}
function setDashMonth(v){ dashMonth = parseInt(v,10); renderDashboard(); }

function computeKPI(){
  if(dashPeriod==='annual'){
    const amount = SALES_THIS_YEAR.reduce((a,b)=>a+b,0);
    const count = ORDER_COUNT_MONTH.reduce((a,b)=>a+b,0);
    return { amount, count, participants:214, avg:Math.round(amount/count), label:'연간 누계' };
  }
  const amount = SALES_THIS_YEAR[dashMonth];
  const count = ORDER_COUNT_MONTH[dashMonth];
  return { amount, count, participants:PARTICIPANTS_MONTH[dashMonth], avg:Math.round(amount/count), label:MONTHS[dashMonth] };
}

/* ---------- 대시보드 (KPI 목업) ---------- */
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const k = computeKPI();
  const maxCat = Math.max(...Object.values(CATEGORY_AMOUNT));
  const maxTop = Math.max(...TOP10_AMOUNT.map(t=>t[1]));

  el.innerHTML = `
    <div class="view-title">직원구매 현황 대시보드</div>
    <div class="view-sub">목업 데이터 — 실제 3원 통합(JMW 자동/기화 수동/기존 데이터) 연동 후 값이 반영됩니다</div>

    <div class="dash-filter">
      <button class="ftab ${dashPeriod==='annual'?'on':''}" data-mode="annual" onclick="setDashPeriod('annual')">연간</button>
      <button class="ftab ${dashPeriod==='monthly'?'on':''}" data-mode="monthly" onclick="setDashPeriod('monthly')">월</button>
      <select id="dashMonthSelect" style="display:${dashPeriod==='monthly'?'inline-block':'none'}" onchange="setDashMonth(this.value)">
        ${MONTHS.map((m,i)=>`<option value="${i}" ${i===dashMonth?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card kc1"><div class="label">총 발주금액 · ${k.label}</div><div class="value">${fmt(k.amount)}</div></div>
      <div class="kpi-card kc2"><div class="label">총 발주건수 · ${k.label}</div><div class="value">${k.count.toLocaleString('ko-KR')}건</div></div>
      <div class="kpi-card kc3"><div class="label">참여 직원 수 · ${k.label}</div><div class="value">${k.participants}명</div></div>
      <div class="kpi-card kc4"><div class="label">평균 발주 건당 금액</div><div class="value">${fmt(k.avg)}</div></div>
    </div>

    <div class="dash-charts-row">
      <div class="panel">
        <div class="panel-hd">월별 매출 추이</div>
        <div class="panel-body"><div class="chart-box"><canvas id="trendChart"></canvas></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd">전년 동기 대비 월별 추이</div>
        <div class="panel-body"><div class="chart-box"><canvas id="yoyChart"></canvas></div></div>
      </div>
    </div>

    <div class="donut-row">
      <div class="panel">
        <div class="panel-hd">유통 채널별 비중 (JMW / 기화)</div>
        <div class="panel-body donut-wrap">
          <div class="chart-box"><canvas id="channelDonut"></canvas></div>
          <div class="donut-legend">
            ${Object.entries(CHANNEL_AMOUNT).map(([k2,v],i)=>`<div class="li"><span class="dot" style="background:${i===0?'var(--brand)':'var(--gold)'}"></span><span>${k2}</span><span class="val">${fmt(v)}</span></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd">생산 분류별 비중 (JMW / 소싱)</div>
        <div class="panel-body donut-wrap">
          <div class="chart-box"><canvas id="mfgDonut"></canvas></div>
          <div class="donut-legend">
            ${Object.entries(MFG_AMOUNT).map(([k2,v],i)=>`<div class="li"><span class="dot" style="background:${i===0?'var(--brand)':'var(--gold)'}"></span><span>${k2}</span><span class="val">${fmt(v)}</span></div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="dash-row">
      <div class="panel">
        <div class="panel-hd">카테고리별 발주 비중 (금액)</div>
        <div class="panel-body">
        ${Object.entries(CATEGORY_AMOUNT).map(([label,amt])=>`
          <div class="bar-item"><div class="bl"><span>${label}</span><span>${fmt(amt)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(amt/maxCat*100).toFixed(0)}%"></div></div></div>`).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd">인기 모델 TOP10 (금액)</div>
        <div class="panel-body">
        ${TOP10_AMOUNT.map(([label,amt])=>`
          <div class="bar-item"><div class="bl"><span>${label}</span><span>${fmt(amt)}</span></div><div class="bar-track"><div class="bar-fill gold" style="width:${(amt/maxTop*100).toFixed(0)}%"></div></div></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="mock-note">※ 위 수치는 전부 더미 데이터입니다.</div>`;

  drawDashboardCharts();
}

function drawDashboardCharts(){
  if(typeof Chart === 'undefined') return;
  [_trendChart,_yoyChart,_channelDonut,_mfgDonut].forEach(c=>{ if(c) c.destroy(); });

  _trendChart = new Chart(document.getElementById('trendChart'), {
    type:'bar',
    data:{ labels:MONTHS, datasets:[{ data:SALES_THIS_YEAR, backgroundColor:'#5B2247', borderRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=>fmt(c.raw) } } },
      scales:{ y:{ ticks:{ callback:(v)=>(v/10000).toLocaleString('ko-KR')+'만' } } } }
  });

  _yoyChart = new Chart(document.getElementById('yoyChart'), {
    type:'bar',
    data:{ labels:MONTHS, datasets:[
      { label:'올해', data:SALES_THIS_YEAR, backgroundColor:'#5B2247', borderRadius:4 },
      { label:'작년', data:SALES_LAST_YEAR, backgroundColor:'#D8CFCB', borderRadius:4 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'top', labels:{ boxWidth:10, font:{size:11} } }, tooltip:{ callbacks:{ label:(c)=>c.dataset.label+' '+fmt(c.raw) } } },
      scales:{ y:{ ticks:{ callback:(v)=>(v/10000).toLocaleString('ko-KR')+'만' } } } }
  });

  _channelDonut = new Chart(document.getElementById('channelDonut'), {
    type:'doughnut',
    data:{ labels:Object.keys(CHANNEL_AMOUNT), datasets:[{ data:Object.values(CHANNEL_AMOUNT), backgroundColor:['#5B2247','#B8862E'], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, cutout:'65%' }
  });

  _mfgDonut = new Chart(document.getElementById('mfgDonut'), {
    type:'doughnut',
    data:{ labels:Object.keys(MFG_AMOUNT), datasets:[{ data:Object.values(MFG_AMOUNT), backgroundColor:['#5B2247','#B8862E'], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, cutout:'65%' }
  });
}

/* ---------- init ---------- */
renderNav(null);
renderHome();
renderCartUI();
</script>
