<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMW 임직원 MALL</title>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F5;
    --surface:#FFFFFF;
    --ink:#1C1A1B;
    --muted:#78706A;
    --border:#E7E1DA;
    --brand:#5B2247;
    --gold:#B8862E;
    --gold-bg:#FBF3E3;
    --maxw:1320px;
    --cmp-win-bg:#E3F5F1; --cmp-win-text:#0F7A6C;
    --cmp-diff-bg:#FBEEE0; --cmp-diff-text:#B5651D;
  }
  html{ scrollbar-gutter:stable; overflow-y:scroll; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none; -moz-user-select:none; user-select:none;
  }
  input, textarea{ -webkit-user-select:text; -moz-user-select:text; user-select:text; }
  img{ -webkit-user-drag:none; user-drag:none; pointer-events:none; }
  h1,h2,h3,.num{font-family:'Space Grotesk','Pretendard',sans-serif;}
  button{ font-family:inherit; }

  .notice-strip{
    font-size:12.5px; color:var(--muted); background:var(--gold-bg);
    padding:6px 20px; text-align:center; border-bottom:1px solid var(--border);
  }

  /* ---- Header ---- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:var(--surface);
  }
  .top-inner{
    max-width:var(--maxw); margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 14px;
    gap:24px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    cursor:pointer; user-select:none; flex:none;
  }
  .brand img{ height:40px; display:block; }
  .brand .mall-name{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px; font-weight:700; letter-spacing:-0.005em; color:var(--brand);
    padding-left:12px; border-left:1px solid var(--border);
  }

  .search-wrap{
    flex:1; max-width:420px; margin-left:auto;
    position:relative;
  }
  .search-wrap input{
    width:100%; height:38px; border:1px solid var(--border); border-radius:19px;
    padding:0 40px 0 16px; font-size:13.5px; background:var(--bg); color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{ border-color:var(--brand); background:var(--surface); }
  .search-wrap .icon{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    font-size:14px; color:var(--muted); cursor:pointer; background:none; border:none;
  }

  /* ---- Category nav ---- */
  nav.cats{
    max-width:var(--maxw); margin:0 auto;
    display:flex; align-items:center; gap:34px;
    padding:6px 16px 16px;
    overflow-x:auto;
  }
  nav.cats button{
    flex:none; background:none; border:none;
    color:var(--ink); padding:4px 0; cursor:pointer;
    font-family:'Space Grotesk','Pretendard',sans-serif;
    font-size:15px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
    position:relative;
  }
  nav.cats button.active{ color:var(--brand); font-weight:700; }
  nav.cats button.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-6px; height:2px; background:var(--brand);
  }
  nav.cats .dash-link{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    font-family:'Space Grotesk','Pretendard',sans-serif;
    color:var(--brand); font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
  }
  nav.cats .dash-link.active{ color:var(--brand); }

  main{ max-width:var(--maxw); margin:0 auto; padding:8px 16px 140px; }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ---- Sections / grids ---- */
  section.cat-section{ margin-top:44px; }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px;
  }
  .section-head h2{
    font-size:19px; font-weight:600; margin:0;
    display:flex; align-items:baseline; gap:8px;
  }
  .section-head h2 .tag{
    font-size:12px; color:var(--muted); font-weight:400; font-family:'Pretendard',sans-serif;
  }
  .section-head button.more{ background:none; border:none; font-size:12.5px; color:var(--muted); cursor:pointer; }

  .back-row{ margin-bottom:18px; }
  .back-row button{
    background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:0;
  }
  .view-title{ font-size:21px; font-weight:700; margin:6px 0 20px; }
  .view-sub{ font-size:13px; color:var(--muted); margin:-14px 0 20px; }

  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
  }
  @media (max-width:1000px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:700px){ .grid{ grid-template-columns:repeat(2,1fr); } }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    overflow:hidden; display:flex; flex-direction:column; cursor:pointer;
  }
  .thumb{
    aspect-ratio:1/1; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:600; font-size:13px; text-align:center; padding:12px;
  }
  .badge-row{ position:absolute; top:8px; left:8px; display:flex; gap:4px; }
  .badge.fv{ background:var(--brand); color:#fff; }
  .badge.cs{ background:#6B6560; color:#fff; }
  .badge{ font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:4px; background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.3); position:relative; z-index:5; }

  .card-body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .model-code{ font-size:11px; color:var(--muted); }
  .name{ font-size:14px; font-weight:600; line-height:1.35; min-height:38px; }

  .price-row{ display:flex; align-items:baseline; gap:6px; margin-top:2px; }
  .price-row .list{ font-size:12px; color:var(--muted); text-decoration:line-through; }
  .price-row .emp-price{ font-size:17px; font-weight:700; color:var(--gold); }
  .price-row .won{ font-size:12px; color:var(--gold); font-weight:600; }

  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:8px; }
  .stepper{ display:flex; align-items:center; border:1px solid var(--border); border-radius:6px; }
  .stepper button{ width:26px; height:28px; border:none; background:none; cursor:pointer; font-size:14px; color:var(--ink); }
  .stepper span{ width:26px; text-align:center; font-size:13px; }
  .add-btn{ flex:1; background:var(--brand); color:#fff; border:none; border-radius:6px; height:32px; font-size:12.5px; font-weight:600; cursor:pointer; }

  /* ---- Cart drawer ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:70;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed; top:0; right:0; height:100%; width:360px; max-width:88vw;
    background:var(--surface); z-index:80;
    transform:translateX(100%); transition:transform .25s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .drawer-head h3{ margin:0; font-size:16px; }
  .drawer-head button{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); }
  .drawer-items{ flex:1; overflow-y:auto; padding:8px 20px; }
  .empty-cart{ color:var(--muted); font-size:13.5px; text-align:center; margin-top:60px; }

  .drawer-item{ display:flex; gap:10px; padding:14px 0; border-bottom:1px solid var(--border); }
  .drawer-item .thumb-sm{ width:52px; height:52px; border-radius:6px; flex:none; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#fff; font-size:9px; font-weight:700; }
  /* 실사진 확대 테스트: 캔버스에 이미 포함된 여백을 살짝 잘라내 제품이 더 크게 보이도록 함 */
  .thumb img, .thumb-sm img, .cmp-thumb-wrap img, .single-photo img{ transform:scale(1.12); }
  .drawer-item .info{ flex:1; min-width:0; }
  .drawer-item .info .n{ font-size:13px; font-weight:600; }
  .drawer-item .info .p{ font-size:12.5px; color:var(--gold); font-weight:700; margin-top:2px; }
  .drawer-item .row2{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .drawer-item .remove{ background:none; border:none; color:var(--muted); font-size:11.5px; cursor:pointer; text-decoration:underline; }
  .mini-stepper{ display:flex; align-items:center; border:1px solid var(--border); border-radius:6px; }
  .mini-stepper button{ width:22px; height:24px; border:none; background:none; cursor:pointer; font-size:13px; color:var(--ink); }
  .mini-stepper span{ width:22px; text-align:center; font-size:12px; }

  .drawer-foot{ padding:16px 20px 20px; border-top:1px solid var(--border); }
  .total-row{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:12px; }
  .total-row b{ font-size:18px; color:var(--gold); }
  .checkout-btn{ width:100%; background:var(--brand); color:#fff; border:none; border-radius:8px; height:46px; font-size:14.5px; font-weight:700; cursor:pointer; }

  /* ---- Compare bar ---- */
  .compare-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:55;
    background:var(--brand); color:#fff;
    padding:14px 20px; display:none;
    align-items:center; justify-content:center; gap:20px;
  }
  .compare-bar.show{ display:flex; }
  .compare-bar .cnt{ font-size:14px; font-weight:600; }
  .compare-bar button.go{
    background:#fff; color:var(--brand); border:none; border-radius:100px;
    padding:9px 22px; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .compare-bar button.clear{ background:none; border:none; color:rgba(255,255,255,.75); font-size:13px; cursor:pointer; text-decoration:underline; }

  /* ---- Compare modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{ background:var(--surface); border-radius:12px; max-width:760px; width:100%; max-height:80vh; overflow:auto; padding:24px; }
  .modal-box.compare-box{ max-width:calc(var(--maxw) + 80px); }
  .cmp-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cmp-head h3{ margin:0; font-size:17px; }
  .cmp-x{ background:none; border:none; font-size:18px; color:var(--muted); cursor:pointer; line-height:1; padding:4px; }
  .cmp-legend{ font-size:12px; color:var(--muted); margin-bottom:14px; line-height:1.5; }
  .cmp-legend .win-dot,.cmp-legend .diff-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 3px -1px 0; }
  .cmp-legend .win-dot{ background:var(--cmp-win-text); }
  .cmp-legend .diff-dot{ background:var(--cmp-diff-text); }

  table.cmp-table{ width:100%; table-layout:fixed; border-collapse:collapse; font-size:13px; }
  table.cmp-table th, table.cmp-table td{
    border-bottom:1px solid var(--border); padding:10px 12px; text-align:left; border-left:1px solid var(--border);
    white-space:normal; word-break:break-word;
  }
  table.cmp-table th:first-child, table.cmp-table td:first-child{
    border-left:none; width:150px; white-space:nowrap; color:var(--muted); font-weight:600; font-size:12px;
  }
  table.cmp-table th{ color:var(--muted); font-weight:600; font-size:12px; vertical-align:top; }
  table.cmp-table td.spec-win{ background:var(--cmp-win-bg); color:var(--cmp-win-text); font-weight:700; }
  table.cmp-table td.spec-win::before{ content:'▲ '; }
  table.cmp-table td.spec-diff{ background:var(--cmp-diff-bg); color:var(--cmp-diff-text); font-weight:600; }

  @media (max-width:700px){
    table.cmp-table{ font-size:11.5px; }
    table.cmp-table th, table.cmp-table td{ padding:8px 6px; }
    table.cmp-table th:first-child, table.cmp-table td:first-child{ width:64px; font-size:10.5px; }
    table.cmp-table th{ font-size:11px; word-break:keep-all; overflow-wrap:break-word; }
    .cmp-thumb-wrap{ height:110px; }
    .cmp-thumb{ width:80px; height:80px; font-size:10px; }
    .cmp-remove, .cmp-cart-btn{ font-size:10px; }
  }

  /* 비교 개수와 무관하게 위아래 높이는 고정 — 배경(칼럼 폭)만 좌우로 늘어남 */
  .cmp-thumb-wrap{ width:100%; height:170px; background:var(--bg); border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; overflow:hidden; }
  .cmp-thumb{ width:120px; height:120px; max-width:80%; max-height:80%; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; flex:none; }
  .cmp-remove{ display:block; width:100%; margin-top:10px; background:none; border:1px solid var(--border); color:#B4402A; font-size:11px; padding:5px 0; border-radius:6px; cursor:pointer; }
  .cmp-remove:hover{ background:#FBEAEA; }
  .cmp-cart-btn{ width:100%; background:var(--brand); color:#fff; border:none; border-radius:6px; padding:8px 0; font-size:12px; font-weight:700; cursor:pointer; }
  .cmp-cart-btn:disabled{ background:var(--muted); cursor:default; }

  .cmp-insights{ margin-top:28px; }
  .cmp-insights h4{ font-size:14px; margin:0 0 4px; }
  .cmp-insights .sub{ font-size:12px; color:var(--muted); margin-bottom:14px; }
  .insight-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:14px; }
  .insight-card{ background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .insight-card b{ display:block; font-size:12.5px; margin-bottom:8px; }
  .insight-card ul{ margin:0; padding-left:16px; font-size:12px; color:var(--ink); line-height:1.6; }

  /* ---- 단일 상품 상세 뷰 ---- */
  .single-view{ display:flex; gap:28px; }
  .single-photo{ width:320px; flex:none; height:320px; background:var(--bg); border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .single-photo .cmp-thumb{ width:200px; height:200px; }
  .single-info{ flex:1; min-width:0; }
  .single-crumb{ font-size:12px; color:var(--muted); margin-bottom:6px; }
  .single-title{ font-size:21px; font-weight:700; margin-bottom:6px; }
  .single-sub{ font-size:13px; color:var(--muted); margin-bottom:12px; }
  .single-badges{ display:flex; gap:6px; margin-bottom:18px; }
  .single-badges span{ font-size:11.5px; padding:4px 10px; border-radius:100px; background:var(--gold-bg); color:var(--brand); font-weight:600; }
  .single-price{ font-size:22px; font-weight:700; color:var(--gold); margin-bottom:18px; }
  table.single-spec{ width:100%; border-collapse:collapse; font-size:13px; margin-bottom:20px; }
  table.single-spec td{ padding:9px 0; border-bottom:1px solid var(--border); }
  table.single-spec td:first-child{ width:110px; color:var(--muted); font-weight:600; font-size:12px; }
  .single-add-btn{ background:var(--brand); color:#fff; border:none; border-radius:8px; padding:12px 22px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .single-add-btn:disabled{ background:var(--muted); cursor:default; }
  .single-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .single-link-btn{
    background:#fff; color:var(--brand); border:1.5px solid var(--brand); border-radius:8px;
    padding:12px 22px; font-size:13.5px; font-weight:700; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center;
  }
  .single-link-btn:hover{ background:var(--gold-bg); }
  @media (max-width:700px){ .single-view{ flex-direction:column; } .single-photo{ width:100%; } }

  .cmp-box{
    position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:5px;
    background:#fff; border:1px solid rgba(0,0,0,.15); box-shadow:0 1px 5px rgba(0,0,0,.35); z-index:5;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:12px; color:transparent; font-weight:700;
  }
  .cmp-box.checked{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .modal-close{ margin-top:16px; background:var(--ink); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13px; cursor:pointer; }

  /* ---- Floating action stack (cart + chat) ---- */
  .fab-stack{
    position:fixed; right:22px; bottom:24px; z-index:60;
    display:flex; flex-direction:column; gap:12px; align-items:flex-end;
    transition:bottom .2s;
  }
  .fab-stack.raised{ bottom:78px; }
  .fab{
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 4px 14px rgba(0,0,0,.18); position:relative;
  }
  .fab.cart{ background:var(--brand); color:#fff; }
  .fab.chat{ background:#1DB954; background:var(--gold); color:#fff; }
  .fab .count{
    position:absolute; top:-4px; right:-4px; background:var(--gold);
    color:#fff; min-width:18px; height:18px; border-radius:9px; font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  /* ---- Dashboard ---- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
  @media (max-width:860px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } }
  .kpi-card{
    border-radius:14px; padding:20px 22px; color:#fff; position:relative; overflow:hidden;
  }
  .kpi-card::after{
    content:''; position:absolute; right:-14px; bottom:-14px; width:84px; height:84px;
    border-radius:50%; background:rgba(255,255,255,.08);
  }
  .kpi-card .label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
    color:rgba(255,255,255,.75); margin-bottom:10px; position:relative; z-index:1;
  }
  .kpi-card .value{
    font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700;
    letter-spacing:-0.5px; position:relative; z-index:1;
  }
  .kc1{ background:linear-gradient(135deg,#4A1A38 0%,#5B2247 60%,#7A3563 100%); }
  .kc2{ background:linear-gradient(135deg,#9A6D1F 0%,#B8862E 60%,#D9A94A 100%); }
  .kc3{ background:linear-gradient(135deg,#181617 0%,#3D3436 100%); }
  .kc4{ background:linear-gradient(135deg,#33473C 0%,#4B6B57 100%); }

  .dash-filter{ display:flex; align-items:center; gap:8px; margin-bottom:22px; }
  .dash-filter .ftab{
    padding:7px 18px; border-radius:16px; border:1.5px solid var(--border); background:#fff;
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .dash-filter .ftab.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .dash-filter select{
    padding:7px 12px; border-radius:16px; border:1.5px solid var(--border); background:#fff;
    font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; outline:none;
  }

  .dash-charts-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
  @media (max-width:900px){ .dash-charts-row{ grid-template-columns:1fr; } }
  .chart-box{ position:relative; height:230px; }

  .donut-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
  @media (max-width:900px){ .donut-row{ grid-template-columns:1fr; } }
  .donut-wrap{ display:flex; align-items:center; gap:24px; }
  .donut-wrap .chart-box{ height:140px; width:140px; flex:none; }
  .donut-legend{ font-size:12.5px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .donut-legend .li{ display:flex; align-items:center; gap:8px; }
  .donut-legend .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .donut-legend .val{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-weight:600; }

  .chart-box.sm{ height:120px; width:120px; margin:0 auto; }
  .triple-donut{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .td-col{ text-align:center; }
  .td-title{ font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:8px; }
  .td-legend{ font-size:11px; margin-top:8px; display:flex; flex-direction:column; gap:4px; text-align:left; }

        <div><label>수령인 연락처 <span class="req">(필수)</span></label><input id="ofRecvPhone" type="text" placeholder="010-0000-0000" disabled></div>
      </div>
      <div class="field-row">
        <label>배송주소 <span class="req">(필수)</span></label>
        <div class="addr-search-row">
          <input id="ofZip" type="text" placeholder="우편번호" readonly>
          <button type="button" class="addr-search-btn" onclick="execDaumPostcode()">주소 검색</button>
        </div>
        <input id="ofAddrBase" type="text" placeholder="기본주소 (검색 버튼으로 채워집니다)" readonly style="margin-top:8px;">
        <input id="ofAddrDetail" type="text" placeholder="상세주소 입력 (동/호수 등)" style="margin-top:8px;">
      </div>
      <div class="field-row">
        <label>결제수단</label>
        <div class="pay-toggle" id="payMethodToggle">
          <button type="button" class="pay-btn active" data-pay="계좌이체" onclick="setPayMethod('계좌이체')">계좌이체</button>
          <button type="button" class="pay-btn" data-pay="카드결제" onclick="setPayMethod('카드결제')">카드결제</button>
        </div>
      </div>

      <div id="bankFields">
        <div class="field-row two">
          <div>
            <label>입금자명 <span class="req">(필수)</span></label>
            <input id="ofDepositor" type="text" placeholder="입금하실 분 성함">
          </div>
          <div>
            <label>입금여부 확인 <span class="req">(필수)</span></label>
            <div class="pay-toggle small">
              <button type="button" class="paid-btn" data-paid="Y" onclick="setPaidStatus('Y')">입금완료</button>
              <button type="button" class="paid-btn" data-paid="N" onclick="setPaidStatus('N')">미입금</button>
            </div>
          </div>
        </div>
        <label class="chk-row" style="margin-top:14px;">
          <input type="checkbox" id="ofCashReceipt" onchange="toggleCashReceipt()"> 현금영수증 발행
        </label>
        <div class="field-row" id="cashReceiptRow" style="display:none; margin-top:8px;">
          <input id="ofCashReceiptNo" type="text" placeholder="발행번호 (휴대폰번호 또는 사업자번호)">
        </div>
      </div>

      <div class="field-row" id="cardNotice" style="display:none;">
        <div class="notice-box">카드결제는 영업지원팀 <b>문경현 대리</b>에게 직접 결제 바랍니다.</div>
      </div>
    </div>
    <div class="order-total-row"><span>총 결제금액</span><b id="orderTotal">0원</b></div>

      <button class="cancel-btn" onclick="closeOrderModal()">취소</button>
      <button class="submit-order-btn" onclick="submitOrder()">발주하기</button>
    </div>
  </div>
</div>

/* ---------- 카드 렌더 ---------- */
function releaseSortKey(p){
  if(!p.released) return 0;
  const m = p.released.match(/(\d{4})\.(\d{1,2})/);
  return m ? parseInt(m[1])*100 + parseInt(m[2]) : 0;
}
function sortByLatest(list){ return [...list].sort((a,b)=> releaseSortKey(b) - releaseSortKey(a)); }

function isFreeVoltage(p){
  if(!p.specs) return false;
  const text = Object.values(p.specs).join(' ');
  if(/프리볼트|free\s*volt/i.test(text)) return true;
  const m = text.match(/(\d{2,3})\s*[-~]\s*(\d{2,3})\s*V/i);
  if(m){
    const lo = parseInt(m[1]), hi = parseInt(m[2]);
    if(lo<=130 && hi>=220) return true;
  }
  return false;
}

function productCard(p){
  const idx = PRODUCTS.indexOf(p);
  const qty = cart[p.id]?.qty || 0;
  const checked = compareSet.has(p.id);
  const noPrice = p.emp===null || p.emp===undefined;
  const img = PRODUCT_IMAGES[p.model];
  return `
  <div class="card" onclick="viewSingleProduct('${p.id}')">
    <div class="thumb" style="background:${img?'#fff':colorFor(idx)}">
      <div class="badge-row">${p.best?'<span class="badge">BEST</span>':''}${isFreeVoltage(p)?'<span class="badge fv">프리볼트</span>':''}${p.comingSoon?'<span class="badge cs">COMING SOON</span>':''}</div>
      <div class="cmp-box ${checked?'checked':''}" data-id="${p.id}" onclick="event.stopPropagation(); toggleCompare('${p.id}', this)">✓</div>
      ${img?`<img src="${img}" style="width:100%;height:100%;object-fit:contain;">`:p.model}
    </div>
    <div class="card-body">
      <div class="model-code">품번 ${p.model}${p.released?` · 출시 ${p.released}`:''}</div>
      <div class="name">${p.name}</div>
      <div class="price-row">
        ${noPrice ? `<span style="color:var(--muted);font-size:13px;">${p.comingSoon?'COMING SOON':'가격 확인중'}</span>` : `<span class="emp-price">${p.emp.toLocaleString('ko-KR')}</span><span class="won">원</span>`}
      </div>
      <div class="qty-row">
        <div class="stepper">
          <button onclick="event.stopPropagation(); stepQty('${p.id}',-1)" ${noPrice?'disabled':''}>–</button>
          <span id="qty-${p.id}">${qty}</span>
          <button onclick="event.stopPropagation(); stepQty('${p.id}',1)" ${noPrice?'disabled':''}>+</button>
        </div>
        <button class="add-btn" onclick="event.stopPropagation(); addToCart('${p.id}')" ${noPrice?'disabled style="opacity:.5;cursor:not-allowed;"':''}>담기</button>
      </div>
    </div>
  </div>`;
}

function renderHome(){

    return `
    <section class="cat-section">
      <div class="section-head">
        <h2>${c.label} <span class="tag">TOP4</span></h2>
        <button class="more" onclick="showCategoryView('${c.key}')">더보기 &gt;</button>
      </div>

function productMatchesQuery(p, q){
  if(p.name.toLowerCase().includes(q) || p.model.toLowerCase().includes(q)) return true;
  if(q==='프리볼트' || q==='free voltage' || q==='freevolt'){ if(isFreeVoltage(p)) return true; }
  if(p.specs){
    for(const v of Object.values(p.specs)){
      if(v && String(v).toLowerCase().includes(q)) return true;
    }
  }
  return false;
}

    el.innerHTML = `

function stepQty(id, delta){
  const el = document.getElementById('qty-'+id);
  let v = parseInt(el.textContent,10) + delta;
  if(v<0) v=0;
  el.textContent = v;
  pendingQty[id]=v;
}
function addToCart(id){
  const p = PRODUCTS.find(p=>p.id===id);
  if(p.emp===null || p.emp===undefined){ alert('아직 가격이 확정되지 않은 상품입니다.'); return; }
  const qty = pendingQty[id] ?? (cart[id]?.qty||0);
  const finalQty = qty>0 ? qty : 1;
  cart[id] = { ...p, qty: finalQty };
  const qtyEl = document.getElementById('qty-'+id);
  if(qtyEl) qtyEl.textContent = finalQty;
  saveCart(cart);
  renderCartUI();
  document.getElementById('addedModalOverlay').classList.add('show');
}

function removeFromCart(id){

  saveCart(cart);
  const qtyEl = document.getElementById('qty-'+id);
  if(qtyEl) qtyEl.textContent = 0;

}
function changeCartQty(id, delta){
  if(!cart[id]) return;
  cart[id].qty += delta;
  if(cart[id].qty<=0) delete cart[id];
  saveCart(cart);
  const qtyEl = document.getElementById('qty-'+id);
  if(qtyEl) qtyEl.textContent = cart[id]?cart[id].qty:0;
}

// 무게처럼 작을수록 좋은 항목. 그 외 숫자 항목은 클수록 좋은 것으로 간주.
const LOWER_IS_BETTER = new Set(['무게','소음']);
function parseSpecNumber(key, str){
  if(!str) return null;
  const s = String(str);
  const m = s.match(/[\d.]+/);
  if(!m) return null;
  let v = parseFloat(m[0]);
  if(key==='무게' && /kg/i.test(s)) v *= 1000; // kg -> g 통일
  return isNaN(v) ? null : v;
}

const SPEC_PHRASE = {
  '무게': v=>`가장 가벼워 손목에 부담이 적습니다 (${v})`,
  '코드길이': v=>`코드가 가장 길어 콘센트에서 멀리 떨어져도 여유롭게 사용할 수 있습니다 (${v})`,
  '와트': v=>`출력이 가장 높습니다 (${v})`,
  '풍속': v=>`바람 세기가 가장 강합니다 (${v})`,
};
function insightBullets(p, items){
  const bullets = [];
  if(isFreeVoltage(p)) bullets.push('프리볼트(100~240V) 지원으로 해외에서도 전압 걱정 없이 사용할 수 있습니다.');
  if(p.specs && p.specs['기능']){
    p.specs['기능'].split('/').map(s=>s.trim()).filter(Boolean).forEach(f=>bullets.push(f+'를 지원합니다.'));
  }
  if(items.length>1 && p.specs){
    Object.keys(p.specs).forEach(k=>{
      if(k==='기능') return;
      const nums = items.map(x=> x.specs ? parseSpecNumber(k, x.specs[k]) : null);
      if(nums.every(n=>n!==null) && new Set(nums).size>1){
        const best = LOWER_IS_BETTER.has(k) ? Math.min(...nums) : Math.max(...nums);
        const myVal = parseSpecNumber(k, p.specs[k]);
        if(myVal===best){
          const phrase = SPEC_PHRASE[k] ? SPEC_PHRASE[k](p.specs[k]) : `${k} 항목에서 가장 우수합니다 (${p.specs[k]})`;
          bullets.push(phrase);
        }
      }
    });
  }
  if(bullets.length===0) bullets.push('등록된 사양 특징 정보가 없습니다.');
  return bullets;
}

          <div class="single-badges">${p.released?`<span>출시 ${p.released}</span>`:''}${isFreeVoltage(p)?'<span>프리볼트</span>':''}</div>

            ${p.url?`<a href="${p.url}" target="_blank" rel="noopener" class="single-link-btn">쇼핑몰에서 보기 ↗</a>`:''}
          </div>
        </div>

  } else {

    titleEl.textContent = '제품 비교';

    const specKeySet = new Set();
    items.forEach(p=>{ const s=effSpecs.get(p.id); if(s) Object.keys(s).forEach(k=>specKeySet.add(k)); });
    const specKeys = [...specKeySet];

    const headerCells = items.map(p=>{
      const idx = PRODUCTS.indexOf(p);
      return `<th>
        <div class="cmp-thumb-wrap">${PRODUCT_IMAGES[p.model] ? `<img src="${PRODUCT_IMAGES[p.model]}" style="width:100%;height:100%;object-fit:contain;">` : `<div class="cmp-thumb" style="background:${colorFor(idx)}">${p.model}</div>`}</div>
        ${p.name}<br><span style="font-weight:400;color:var(--muted);">품번 ${p.model}${p.released?' · '+p.released:''}</span>
        <button class="cmp-remove" onclick="removeFromCompareOrClose('${p.id}')">✕ 비교에서 제외</button>
      </th>`;
    }).join('');

    const priceRow = `<tr><td><b>직원가</b></td>${items.map(p=>`<td style="color:var(--gold);font-weight:700;">${p.emp!=null?fmt(p.emp):(p.comingSoon?'COMING SOON':'가격 확인중')}</td>`).join('')}</tr>`;
    const cartRow = `<tr><td></td>${items.map(p=>{

    }).join('')}</tr>`;

    const specRows = specKeys.length ? specKeys.map(k=>{
      let winVal = null;
      const rawVals = items.map(p=> (effSpecs.get(p.id) && effSpecs.get(p.id)[k]) || null);
      const allDiffer = new Set(rawVals).size > 1;
      if(allDiffer){
        const nums = items.map(p=> effSpecs.get(p.id) ? parseSpecNumber(k, effSpecs.get(p.id)[k]) : null);
        if(nums.every(n=>n!==null) && new Set(nums).size>1){
          winVal = LOWER_IS_BETTER.has(k) ? Math.min(...nums) : Math.max(...nums);
        }
      }
      const cells = items.map(p=>{
        const s = effSpecs.get(p.id);
        const raw = (s && s[k]) || '-';
        let cls = '';
        if(winVal!==null){

          cls = ' class="spec-diff"';
        }
        return `<td${cls}>${raw}</td>`;
      }).join('');
      return `<tr><td>${k}</td>${cells}</tr>`;
    }).join('') : `<tr><td colspan="${items.length+1}" style="color:var(--muted);">등록된 사양 정보가 없습니다.</td></tr>`;

      <table class="cmp-table">
        <tr><th>구분</th>${headerCells}</tr>
        ${priceRow}
        ${cartRow}
        ${specRows}
      </table>
      ${insights}`;
  }

  document.getElementById('compareModalOverlay').classList.add('show');
  const box = document.querySelector('#compareModalOverlay .modal-box');

    if(!paidStatus){ alert('입금여부(입금완료 / 미입금)를 선택해주세요.'); return; }
    if(document.getElementById('ofCashReceipt').checked && !document.getElementById('ofCashReceiptNo').value.trim()){
      alert('현금영수증 발행번호를 입력해주세요.'); return;
    }
  }

  alert('주문이 접수되었습니다.\n\n(실제 연동 시 이 시점에 구글시트 기록 + 영업지원팀 구글챗 알림이 자동 발송됩니다)');
  cart = {}; saveCart(cart); renderCartUI();
  closeOrderModal();
}

/* ---------- 대시보드: 실제 ERP 데이터 연동 ---------- */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNmEf7NKTERNwkAggf4OCxIi2fQkWqW7p_KoVmTKuPfMAdDUqdy4IsAvUFNtPs82x3sw/exec';
const CAT_LABEL = { dryer:'드라이어', styler:'스타일러', haircare:'헤어케어', acc:'악세사리', life:'생활가전', etc:'미분류' };

function normModel(s){ return String(s||'').toUpperCase().replace(/[\s_-]/g,''); }
function shortYm(ym){ return ym ? ym.slice(2) : ym; } // "2026-09" -> "26-09"
const MODEL_TO_CAT = {};
PRODUCTS.forEach(p=>{ MODEL_TO_CAT[normModel(p.model)] = p.cat; });

// 대시보드 집계 전용 수동 매핑 — 단종/과거 품번 등 쇼핑몰 카탈로그엔 없는 품번의 분류+표시명
const MANUAL_MODEL_OVERRIDE = {
  'CMCA050001': { cat:'haircare', name:'로아띠 헤어오일 80ml' },
  'CMCA070001': { cat:'haircare', name:'로아띠 크림미스트 200ml' },
  'CMCA090001': { cat:'haircare', name:'로아띠 이너리페어 본딩 트리트먼트 250ml' },
  'CMCA080001': { cat:'haircare', name:'로아띠 피토레스트 480ml' },
  'CCA040006':  { cat:'haircare', name:'실크웨어 스페셜세트' },
  'CMCA060002': { cat:'haircare', name:'로아띠 컬크림 미니어처' },
  'CMCA070002': { cat:'haircare', name:'로아띠 크림미스트 듀오세트' },
  'CMCA060001': { cat:'haircare', name:'로아띠 컬크림 160ml' },
  'CCL010003':  { cat:'haircare', name:'온클린 샴푸' },
};

// 사양 대시보드(스펙 DB) 품번 → 카테고리 매핑 (단종/미취급 품번까지 폭넓게 커버)
const SPEC_MODEL_KEYS_SORTED = Object.keys(SPEC_MODEL_TO_CAT).sort((a,b)=>b.length-a.length);

function categoryOf(model){
  const nm = normModel(model);
  if(MANUAL_MODEL_OVERRIDE[nm]) return MANUAL_MODEL_OVERRIDE[nm].cat;
  if(MODEL_TO_CAT[nm]) return MODEL_TO_CAT[nm];
  if(SPEC_MODEL_TO_CAT[nm]) return SPEC_MODEL_TO_CAT[nm];
  for(const key of SPEC_MODEL_KEYS_SORTED){
    if(key.length>=5 && nm.startsWith(key)) return SPEC_MODEL_TO_CAT[key];
  }
  return 'etc';
}
function displayNameOf(model, fallbackName){
  const o = MANUAL_MODEL_OVERRIDE[normModel(model)];
  return (o && o.name) ? o.name : fallbackName;
}

let erpRows = null, erpFetchPromise = null;
let dashYear = null;
let dashMonth = 'all'; // 'all' 또는 'MM'
let _trendChart=null, _yoyChart=null, _channelAmtDonut=null, _jmwCatDonut=null, _ghCatDonut=null;

function isExcludedErpRow(r){
  const m = String(r.model||'');
  return m.indexOf('소모품') !== -1 || /SP ?81/i.test(m);
}

async function loadErpData(){
  if(erpRows) return erpRows;
  if(!erpFetchPromise){
    erpFetchPromise = fetch(APPS_SCRIPT_URL).then(r=>{
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).then(rows=> rows.filter(r=>!isExcludedErpRow(r)));
  }
  erpRows = await erpFetchPromise;
  return erpRows;
}

function computeKPI(rows){
  const amount = rows.reduce((s,r)=>s+r.amount,0);
  const qty = rows.reduce((s,r)=>s+r.qty,0);
  const avg = qty ? Math.round(amount/qty) : 0;
  return { amount, qty, avg };
}

function setDashYear(y){ dashYear = y; dashMonth = 'all'; if(erpRows) renderDashboardWithData(erpRows); }
function setDashMonth(m){ dashMonth = m; if(erpRows) renderDashboardWithData(erpRows); }

async function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  el.innerHTML = `<div class="view-title">직원구매 현황 대시보드</div><div class="view-sub">ERP 데이터 불러오는 중...</div>`;
  let rows;
  try{
    rows = await loadErpData();
  } catch(err){
    el.innerHTML = `<div class="view-title">직원구매 현황 대시보드</div>
      <div class="view-sub" style="color:#B4402A;">ERP 데이터를 불러오지 못했습니다. 잠시 후 다시 시도하거나 네트워크 연결을 확인해주세요.</div>`;
    return;
  }
  const years = [...new Set(rows.map(r=>r.ym.slice(0,4)))].sort();
  if(dashYear===null) dashYear = years.includes('2026') ? '2026' : (years[years.length-1] || null);
  renderDashboardWithData(rows);
}

function renderDashboardWithData(rows){
  const el = document.getElementById('view-dashboard');
  const years = [...new Set(rows.map(r=>r.ym.slice(0,4)))].sort();
  const yearRows = dashYear ? rows.filter(r=>r.ym.startsWith(dashYear)) : rows;
  const monthsInYear = [...new Set(yearRows.map(r=>r.ym.slice(5,7)))].sort();
  const scopeRows = (dashMonth && dashMonth!=='all') ? yearRows.filter(r=>r.ym===`${dashYear}-${dashMonth}`) : yearRows;
  const k = computeKPI(scopeRows);
  const yms = [...new Set(scopeRows.map(r=>r.ym))].sort();
  const periodLabel = yms.length? (yms.length===1 ? shortYm(yms[0]) : `${shortYm(yms[0])} ~ ${shortYm(yms[yms.length-1])}`) : '-';

  // 카테고리별 금액 (선택 기간 기준)
  const catMap = {}; const unmatched = new Set();
  scopeRows.forEach(r=>{
    const c=categoryOf(r.model);
    if(c==='etc') unmatched.add(r.model);
    catMap[c]=(catMap[c]||0)+r.amount;
  });
  const catEntries = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const maxCat = Math.max(1, ...catEntries.map(e=>e[1]));

  // 채널별 (선택 기간 기준)
  const chAmt = {}, chQty = {};
  scopeRows.forEach(r=>{ chAmt[r.channel]=(chAmt[r.channel]||0)+r.amount; chQty[r.channel]=(chQty[r.channel]||0)+r.qty; });

  // 카테고리별 TOP5 (수량 기준, 선택 기간)
  const TOP5_CATS = ['dryer','styler','haircare','life'];
  const top5ByCat = {};
  TOP5_CATS.forEach(c=>top5ByCat[c]={});
  scopeRows.forEach(r=>{
    const c = categoryOf(r.model);
    if(!TOP5_CATS.includes(c)) return;
    const key = normModel(r.model);
    if(!top5ByCat[c][key]) top5ByCat[c][key] = { name:displayNameOf(r.model, r.name||r.model), qty:0 };
    top5ByCat[c][key].qty += r.qty;
  });

  el.innerHTML = `
    <div class="view-title">직원구매 현황 대시보드</div>
    <div class="view-sub">ERP 연동 실데이터 — 금액은 VAT 별도</div>
    <div class="view-sub" style="margin-top:-14px;">📅 매월 초(1~2일경) 전월 실적이 반영됩니다 — 예: 9월 1~2일에 8월 실적 추가, 10월 1~2일에 9월 실적 추가</div>

    <div class="dash-filter">
      <span style="font-size:12.5px;color:var(--muted);margin-right:4px;">연도</span>
      <select id="dashYearSelect" onchange="setDashYear(this.value)">
        ${years.map(y=>`<option value="${y}" ${y===dashYear?'selected':''}>${y}년</option>`).join('')}
      </select>
      <span style="font-size:12.5px;color:var(--muted);margin:0 4px 0 10px;">월</span>
      <select id="dashMonthSelect" onchange="setDashMonth(this.value)">
        <option value="all" ${dashMonth==='all'?'selected':''}>전체</option>
        ${monthsInYear.map(m=>`<option value="${m}" ${m===dashMonth?'selected':''}>${m}월</option>`).join('')}
      </select>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card kc1"><div class="label">총 매출액 · ${periodLabel}</div><div class="value">${fmt(k.amount)}</div></div>
      <div class="kpi-card kc2"><div class="label">총 판매수량 · ${periodLabel}</div><div class="value">${k.qty.toLocaleString('ko-KR')}EA</div></div>
      <div class="kpi-card kc3"><div class="label">평균 단가 · ${periodLabel}</div><div class="value">${fmt(k.avg)}</div></div>
      <div class="kpi-card kc4"><div class="label">데이터 기간</div><div class="value" style="font-size:16px;">${periodLabel}</div></div>
    </div>

    <div class="dash-charts-row">
      <div class="panel">
        <div class="panel-hd">월별 매출 추이 (${dashYear}년)</div>
        <div class="panel-body"><div class="chart-box"><canvas id="trendChart"></canvas></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd">전년 동기 대비 월별 추이</div>
        <div class="panel-body"><div class="chart-box"><canvas id="yoyChart"></canvas></div></div>
      </div>
    </div>

    <div class="donut-row">
      <div class="panel">
        <div class="panel-hd">채널별 매출 비중 (JMW / 기화)</div>
        <div class="panel-body">
          <div class="triple-donut">
            <div class="td-col">
              <div class="td-title">전체 채널</div>
              <div class="chart-box sm"><canvas id="channelAmtDonut"></canvas></div>
              <div class="td-legend">
                ${Object.keys(chAmt).map((k2,i)=>`<div class="li"><span class="dot" style="background:${i===0?'var(--brand)':'var(--gold)'}"></span><span>${k2}</span><span class="val">${fmt(chAmt[k2])} · ${(chQty[k2]||0).toLocaleString('ko-KR')}EA</span></div>`).join('')}
              </div>
            </div>
            <div class="td-col">
              <div class="td-title">JMW 품목 비중</div>
              <div class="chart-box sm"><canvas id="jmwCatDonut"></canvas></div>
              <div class="td-legend" id="jmwCatLegend"></div>
            </div>
            <div class="td-col">
              <div class="td-title">기화 품목 비중</div>
              <div class="chart-box sm"><canvas id="ghCatDonut"></canvas></div>
              <div class="td-legend" id="ghCatLegend"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd">카테고리별 매출 비중 (${dashYear}년)</div>
        <div class="panel-body">
        ${catEntries.map(([cat,amt])=>`
          <div class="bar-item"><div class="bl"><span>${CAT_LABEL[cat]||cat}</span><span>${fmt(amt)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(amt/maxCat*100).toFixed(0)}%"></div></div></div>`).join('')}
        ${unmatched.size ? `<div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6;">※ 미분류(카탈로그에 없는 품번): ${[...unmatched].join(', ')}</div>` : ''}
        </div>
      </div>
    </div>

    <div class="top5-row">
      ${TOP5_CATS.map(c=>{
        const items = Object.values(top5ByCat[c]).sort((a,b)=>b.qty-a.qty).slice(0,5);
        const maxQ = Math.max(1, ...items.map(i=>i.qty));
        return `
        <div class="panel">
          <div class="panel-hd">${CAT_LABEL[c]} TOP5 (수량)</div>
          <div class="panel-body">
            ${items.length? items.map(i=>`
              <div class="bar-item"><div class="bl"><span>${i.name}</span><span>${i.qty.toLocaleString('ko-KR')}EA</span></div><div class="bar-track"><div class="bar-fill gold" style="width:${(i.qty/maxQ*100).toFixed(0)}%"></div></div></div>`).join('')
              : `<div style="color:var(--muted);font-size:12px;">데이터 없음</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="mock-note">※ ERP 원본에서 품번/수량/금액/수주일만 집계된 데이터입니다 (개인정보 미포함).</div>`;

  drawDashboardCharts(rows, yearRows);
}

function formatEok(v){
  if(v==null) return '';
  const m = v/1000000;
  return (Math.round(m*10)/10).toLocaleString('ko-KR')+'백만';
}

function drawDashboardCharts(allRows, yearRows){
  if(typeof Chart === 'undefined') return;
  if(typeof ChartDataLabels !== 'undefined') Chart.register(ChartDataLabels);
  [_trendChart,_yoyChart,_channelAmtDonut,_jmwCatDonut,_ghCatDonut].forEach(c=>{ if(c) c.destroy(); });
  const noGrid = { x:{ grid:{display:false} }, y:{ grid:{display:false}, ticks:{ callback:(v)=>(v/10000).toLocaleString('ko-KR')+'만' } } };

  const monthAmt = {};
  yearRows.forEach(r=>{ monthAmt[r.ym] = (monthAmt[r.ym]||0)+r.amount; });
  const trendMonths = Object.keys(monthAmt).sort();

  _trendChart = new Chart(document.getElementById('trendChart'), {
    type:'bar',
    data:{ labels:trendMonths.map(shortYm), datasets:[{ data:trendMonths.map(m=>monthAmt[m]), backgroundColor:'#5B2247', borderRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:18 } },
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=>fmt(c.raw) } },
        datalabels:{ anchor:'end', align:'end', color:'#5B2247', font:{size:10, weight:'700'}, formatter:formatEok } },
      scales:noGrid }
  });

  // 전년 동기 대비: 선택 연도 vs 직전 연도
  const prevYear = String(Number(dashYear)-1);
  const compareYears = [prevYear, dashYear].filter(y=>allRows.some(r=>r.ym.startsWith(y)));
  const yoyBox = document.getElementById('yoyChart').closest('.panel-body');
  if(compareYears.length>=2){
    const relevant = allRows.filter(r=>compareYears.includes(r.ym.slice(0,4)));
    const allMM = [...new Set(relevant.map(r=>r.ym.slice(5,7)))].sort();
    const byYearMM = {};
    compareYears.forEach(y=>byYearMM[y]={});
    relevant.forEach(r=>{ const y=r.ym.slice(0,4), mm=r.ym.slice(5,7); byYearMM[y][mm]=(byYearMM[y][mm]||0)+r.amount; });
    _yoyChart = new Chart(document.getElementById('yoyChart'), {
      type:'bar',
      data:{ labels:allMM.map(m=>m+'월'), datasets: compareYears.map((y)=>({
        label:y+'년', data: allMM.map(mm=>byYearMM[y][mm]||0),
        backgroundColor: y===dashYear ? '#5B2247' : '#D8CFCB', borderRadius:4
      })) },
      options:{ responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ top:18 } },
        plugins:{ legend:{ position:'top', labels:{ boxWidth:10, font:{size:11} } }, tooltip:{ callbacks:{ label:(c)=>c.dataset.label+' '+fmt(c.raw) } },
          datalabels:{ anchor:'end', align:'end', color:(ctx)=>ctx.dataset.backgroundColor, font:{size:9, weight:'700'}, formatter:formatEok } },
        scales:noGrid }
    });
  } else if(yoyBox){
    yoyBox.innerHTML = '<div style="color:var(--muted);font-size:12.5px;padding:20px 0;text-align:center;">비교할 전년도 데이터가 아직 없습니다.</div>';
  }

  const DONUT_PALETTE = ['#5B2247','#B8862E','#3F5B4A','#8A3A62','#6B7A6E','#4A5568'];

  // ① 전체 채널 비중 (JMW/기화 매출액, % 표시)
  const chAmt = {};
  yearRows.forEach(r=>{ chAmt[r.channel]=(chAmt[r.channel]||0)+r.amount; });
  const chTotal = Object.values(chAmt).reduce((a,b)=>a+b,0) || 1;
  _channelAmtDonut = new Chart(document.getElementById('channelAmtDonut'), {
    type:'doughnut',
    data:{ labels:Object.keys(chAmt), datasets:[{ data:Object.values(chAmt), backgroundColor:['#5B2247','#B8862E'], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'60%',
      plugins:{ legend:{display:false},
        datalabels:{ color:'#fff', font:{size:11, weight:'700'}, formatter:(v)=>Math.round(v/chTotal*100)+'%' } } }
  });

  // ②③ JMW / 기화 각각의 품목(카테고리)별 비중
  function renderCatDonut(canvasId, legendId, channelKey){
    const sub = yearRows.filter(r=>r.channel===channelKey);
    const map = {};
    sub.forEach(r=>{ const c=categoryOf(r.model); map[c]=(map[c]||0)+r.amount; });
    const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
    const total = entries.reduce((s,e)=>s+e[1],0) || 1;
    const qtyMap = {};
    sub.forEach(r=>{ const c=categoryOf(r.model); qtyMap[c]=(qtyMap[c]||0)+r.qty; });

    const chart = new Chart(document.getElementById(canvasId), {
      type:'doughnut',
      data:{ labels:entries.map(e=>CAT_LABEL[e[0]]||e[0]), datasets:[{ data:entries.map(e=>e[1]), backgroundColor:DONUT_PALETTE, borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'60%',
        plugins:{ legend:{display:false},
          datalabels:{ color:'#fff', font:{size:9, weight:'700'}, formatter:(v)=> v/total<0.06 ? '' : Math.round(v/total*100)+'%' } } }
    });
    document.getElementById(legendId).innerHTML = entries.map(([cat,amt],i)=>`
      <div class="li"><span class="dot" style="background:${DONUT_PALETTE[i%DONUT_PALETTE.length]}"></span><span>${CAT_LABEL[cat]||cat}</span><span class="val">${fmt(amt)}·${(qtyMap[cat]||0).toLocaleString('ko-KR')}EA</span></div>`).join('') || '<div style="color:var(--muted);">데이터 없음</div>';
    return chart;
  }
  _jmwCatDonut = renderCatDonut('jmwCatDonut', 'jmwCatLegend', 'JMW');
  _ghCatDonut = renderCatDonut('ghCatDonut', 'ghCatLegend', '기화');
}



/* ---------- init ---------- */
renderNav(null);
renderHome();
renderCartUI();
</script>
